<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#f5f1e6">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport-LK Abitur NRW 2027 – Lernplattform</title>
<style>
:root{--bg:#f5f1e6;--card:#fffdf6;--ink:#14231a;--mut:#5b6b60;--line:#d5ddd6;--acc:#1f6b4a;--acc2:#e8f2ec;--ok:#1d7a3e;--okb:#dff3e5;--bad:#b3261e;--badb:#fbe3e1;--hi:#f2c200;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#17251d;--ink:#e8f0ea;--mut:#9db0a3;--line:#2b3d32;--acc:#5fcf97;--acc2:#1d3328;--ok:#6fe39a;--okb:#16341f;--bad:#ff8d85;--badb:#3b1a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#17251d;--ink:#e8f0ea;--mut:#9db0a3;--line:#2b3d32;--acc:#5fcf97;--acc2:#1d3328;--ok:#6fe39a;--okb:#16341f;--bad:#ff8d85;--badb:#3b1a18;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Iowan Old Style",serif}
h1,h2,h3,button,.tag{font-family:"Trebuchet MS","Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.1;margin:.3em 0 .2em;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 22px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.t{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:6px;padding:14px;text-align:left;cursor:pointer;color:var(--ink);font-size:1rem}
.t:hover,.t:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.t b{display:block;font-size:1.02rem;margin-bottom:4px}
.t small{color:var(--mut);display:block;line-height:1.4}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:4px;padding:1px 8px;font-size:.78rem;margin-top:8px;font-weight:600}
.all{background:var(--acc);color:#fff;border-left-color:var(--hi)}
.all small{color:#e6f4ec}
.all .tag{background:#ffffff26;color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
button.b{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-size:.95rem;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
.q h2{font-size:1.15rem;margin:0 0 14px;line-height:1.35}
.o{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:11px 13px;margin-bottom:8px;font:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--acc)}
.o.ok{background:var(--okb);border-color:var(--ok)}
.o.no{background:var(--badb);border-color:var(--bad)}
.fb{margin-top:12px;padding:12px;border-radius:6px;background:var(--acc2)}
.sol{margin-top:12px;padding:12px;border-left:4px solid var(--ok);background:var(--okb);white-space:pre-line}
.meta{color:var(--mut);font-size:.88rem;font-family:"Trebuchet MS",sans-serif;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.big{font-size:3rem;font-family:"Trebuchet MS",sans-serif;font-weight:700;color:var(--acc);margin:0}
textarea{width:100%;min-height:110px;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.top{display:flex;justify-content:flex-end}

#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{flex:1;background:none;border:0;padding:14px 2px;font-size:.85rem;color:var(--mut);cursor:pointer;font-weight:600}
#nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
.st b{display:block;font:700 1.5rem "Trebuchet MS",sans-serif;color:var(--acc)}.st span{font-size:.8rem;color:var(--mut)}
.hd{font-size:1rem;margin:22px 0 8px}.prog.sm{height:6px;margin:8px 0 4px}
.wk{display:block;width:100%;margin-bottom:8px}
.pl{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:6px}
.t:disabled{opacity:.5;cursor:default}
input[type=date]{font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-left:8px}
.op{margin-bottom:8px}.op h2{margin-bottom:6px}.pl small{color:var(--mut)}
</style>
</head>

[["Nenne die drei Lernphasen nach Meinel/Schnabel.","Grobkoordination, Feinkoordination, Feinstkoordination (Stabilisierung, variable Verfügbarkeit)."],["Beschreibe die Grobkoordination.","Erste Realisierung des Grobablaufs; Bewegung noch fehlerhaft, ungenau und unökonomisch. Üben unter vereinfachten Bedingungen."],["Was bedeutet „vom Leichten zum Schweren“ in methodischen Übungsreihen?","Anforderungen werden schrittweise gesteigert, z. B. Ball erst ruhend, dann zugeworfen, dann unter Gegnerdruck."],["Nenne zwei Wege, eine Bewegung für Lernende zu vereinfachen.","Informationsanforderungen verringern (Zeitlupe, Hilfen), Druckbedingungen senken (weniger Zeit-/Präzisionsdruck), Variabilität reduzieren, Hilfsgeräte nutzen."],["Wie unterscheiden sich Fein- und Feinstkoordination?","Fein: Bewegung weitgehend fehlerfrei unter günstigen Bedingungen. Feinst: stabil, automatisiert und variabel anwendbar auch unter Druck und Störungen."]],
[["Nenne die fünf Analysatoren.","Optisch, akustisch, taktil, kinästhetisch, statico-dynamisch (vestibulär)."],["Welche Aufgabe hat der kinästhetische Analysator?","Propriorezeptoren in Muskelspindeln, Sehnen und Gelenken melden Länge, Spannung und Gelenkstellung."],["Was sind invariante Merkmale eines generalisierten motorischen Programms?","Reihenfolge der Elemente, relative Zeitstruktur, relative Kraft."],["Was sind die Parameter eines GMP? Nenne ein Beispiel.","Gesamtdauer, Gesamtkraft, beteiligte Muskelgruppen. Beispiel: Wurf weit oder kurz bei gleicher Grundstruktur."],["Welche Folge hat die Theorie von Schmidt für das Üben?","Variables Üben mit verschiedenen Parametern fördert die Programmbildung und Anpassungsfähigkeit."]],
[["Nenne drei biomechanische Prinzipien nach Hochmuth.","Anfangskraft, optimaler Beschleunigungsweg, zeitliche Koordination von Teilimpulsen, Gegenwirkung, Impulserhaltung (Auswahl)."],["Erkläre das Prinzip der Anfangskraft an einem Beispiel.","Eine Gegenbewegung (Ausholen beim Wurf, Counter-Movement-Jump) dehnt die Muskulatur vor und erhöht die Endkraft."],["Was unterscheidet Haupt- und Hilfsfunktionsphasen (Göhner)?","Hauptfunktionsphase realisiert unmittelbar das Bewegungsziel. Hilfsfunktionsphasen sind vorbereitend, unterstützend oder überleitend."],["Was besagt das Prinzip des optimalen Beschleunigungswegs?","Der Beschleunigungsweg wird so lang und zielgerichtet wie möglich genutzt, damit mehr Impuls entsteht."],["Nenne die drei Phasen azyklischer Bewegungen nach Meinel.","Vorbereitungs-, Haupt- und Endphase."]],
[["Nenne die fünf Druckbedingungen im KAR-Modell.","Präzisions-, Zeit-, Komplexitäts-, Situations- und Belastungsdruck."],["Erläutere Zeitdruck an einem Beispiel.","Wenig Zeit oder hohe Geschwindigkeit nötig, z. B. Sprint oder Abwehr im Tischtennis."],["Nenne die Stufen des Stressmodells nach Lazarus.","Stressor, Wahrnehmungsfilter, primäre Bewertung (positiv, gefährlich, irrelevant), sekundäre Bewertung (Ressourcen), Coping, Neubewertung."],["Unterschied zwischen problem- und emotionsorientiertem Coping?","Problemorientiert: Situation verändern (Hilfe suchen, planen). Emotionsorientiert: Belastung regulieren (Entspannung, Atmung)."],["Unterschied zwischen Eustress und Disstress?","Eustress aktiviert und fördert Leistung. Disstress überfordert und hemmt."]],
[["Erkläre die Superkompensation.","Belastung führt zu Ermüdung, in der Erholung steigt die Leistungsfähigkeit über das Ausgangsniveau. Der nächste Reiz sollte zu diesem Zeitpunkt folgen."],["Nenne drei Trainingsprinzipien.","Progressive Belastungssteigerung, Variation, Individualisierung, Periodisierung, Wechsel von Belastung und Erholung."],["Wie trainiert man Hypertrophie?","Mittlere Lasten (ca. 60–80 %), 8–12 Wiederholungen, mehrere Serien, kurze Pausen."],["Wie trainiert man Maximalkraft über intramuskuläre Koordination?","Sehr hohe Lasten (ca. 90–100 %), 1–3 Wiederholungen, lange Pausen. Ziel: bessere Rekrutierung und Synchronisation."],["Nenne die konditionellen Fähigkeiten mit je einem Beispiel.","Kraft (Kugelstoß), Schnelligkeit (Sprint), Ausdauer (5000 m), Beweglichkeit (Hürdenschritt). Kombinationen: Schnellkraft, Kraftausdauer."]],
[["Beschreibe die anaerob-alaktazide Energiebereitstellung.","Spaltung von ATP und Kreatinphosphat ohne Sauerstoff und ohne Laktat. Sehr hohe Leistung, nur wenige Sekunden."],["Beschreibe die anaerob-laktazide Energiebereitstellung.","Glykogenabbau ohne Sauerstoff mit Laktatbildung. Übersäuerung drosselt die Intensität."],["Beschreibe die aerobe Energiebereitstellung.","Vollständiger Abbau von Glukose und Fettsäuren mit Sauerstoff zu CO2 und Wasser. Für lange Belastungen mit geringer Intensität."],["Was ist ein „Hungerast“?","Nach ca. 90 Minuten sind die Glykogenvorräte leer, der Blutzucker sinkt (Hypoglykämie), starker Ermüdungsschub. Gegenmaßnahme: rechtzeitig Kohlenhydrate zuführen."],["Nenne Anpassungen durch Ausdauertraining.","Größeres Schlagvolumen (Sportherz), niedrigere Ruhefrequenz, Kapillarisierung, mehr Mitochondrien, höhere VO2max."]],
[["Definiere „Motive“ nach Gabler.","Aus Verhalten und Äußerungen erschlossene, situations- und zeitüberdauernde, individuelle Bereitschaft zu zielgerichtetem Verhalten."],["Nenne die drei Bezugsbereiche der Motive im Sport.","Sporttreiben selbst, Ergebnis des Sporttreibens, Sport als Mittel zu weiteren Zwecken. Jeweils ich-bezogen oder im sozialen Kontext."],["Erkläre das Motiv „Leistung als Prestige“ an einem Beispiel.","Ergebnisbezogen im sozialen Kontext, z. B. Weltranglistenerster werden wollen."],["Beschreibe den Ablauf im Taktik-Spiel-Modell.","Spielform, Taktikproblem erkennen, Lösungen entwickeln, Technik üben, zurück ins Spiel."],["Welchen Vorteil hat das Taktik-Spiel-Modell?","Fördert Spielverständnis, Motivation und Transfer. Technik wird mit Sinn geübt."]],
[["Erkläre die Frustrations-Aggressions-Theorie.","Frustration (Blockade der Zielerreichung) führt zu Aggression."],["Erkläre den lerntheoretischen Ansatz.","Aggression wird durch Beobachtung (Modelllernen) und Verstärkung erlernt (Bandura)."],["Erkläre den sozialisationstheoretischen Ansatz (Heitmeyer).","Gewalt entsteht durch Sozialisationsbedingungen, Desintegration und Anerkennungsdefizite."],["Was unterscheidet formelle und informelle Fairness?","Formell: Regeln einhalten. Informell: Respekt und Chancengleichheit über die Regeln hinaus."],["Nenne ein Beispiel für das Spannungsfeld Ideal und Wirklichkeit.","Taktisches Foul oder Schwalbe trotz Fairnessideal wegen Erfolgsdruck."]],
[["Nenne die fünf fundamentalen Prinzipien des Olympismus (Coubertin).","Harmonische Ausbildung, Selbstvollendung, Amateurgesinnung, Bindung an sportliche Grundsätze (Fairplay), Friedensidee."],["Wer entscheidet über Programmänderungen bei Olympia?","Die IOC-Exekutivkommission, beraten von der Programmkommission (OPK). Die Session legt Kernsportarten fest."],["Welche Voraussetzung gilt für die Aufnahme einer Sportart?","Der Internationale Fachverband muss vom IOC anerkannt sein, seine Statuten müssen zur Charta passen (z. B. Anti-Doping-Regeln)."],["Welche Ziele verfolgen Agenda 2020 und 2020+5?","Erneuerung, Nachhaltigkeit, Geschlechterausgewogenheit, begrenzte Kosten und Teilnehmerzahlen."],["Warum steht Kommerzialisierung im Konflikt mit Coubertin?","Sie widerspricht der Amateurgesinnung: Profisport, TV-Rechte und Preisgelder."]],
[["Nenne die Kriterien der WADA-Verbotsliste.","Leistungssteigerung, Gesundheitsrisiko, Verstoß gegen den Geist des Sports. Mindestens zwei müssen erfüllt sein."],["Erkläre Blutdoping mit Wirkung und Risiken.","Eigen-/Fremdbluttransfusion erhöht Hämoglobin und O2-Aufnahme. Risiken: Thrombosen, Embolien, Infektionen."],["Erkläre Stimulantien mit Wirkung und Risiken.","Wirken auf das Nervensystem, erhöhen die Ermüdungsschwelle. Risiken: Herzrhythmusstörungen, Kreislaufversagen, Depressionen."],["Nenne sportstrukturelle Gründe für Doping.","Medaillen- und Erfolgsdruck, Prämien, Medieninteresse, Fördersysteme, Sponsoren."],["Nenne individuelle Gründe für Doping.","Ehrgeiz, Existenzangst, Gruppendruck, Rückkehr nach Verletzung."]],
[["Was ist die Kernidee des Risikofaktoren-Modells?","Krankheit entsteht durch Risikofaktoren wie Bewegungsmangel oder Rauchen. Prävention durch Vermeidung."],["Was bedeutet das Gesundheits-Krankheits-Kontinuum?","Der Mensch ist nie völlig gesund oder krank, sondern bewegt sich zwischen den Polen (Antonovsky)."],["Nenne die drei Komponenten des Kohärenzsinns.","Verstehbarkeit, Handhabbarkeit, Bedeutsamkeit."],["Nenne Beispiele für Widerstandsressourcen.","Soziale Unterstützung, Wissen, Selbstvertrauen, Fitness."],["Nenne Risiken des Sporttreibens.","Überlastung, Verletzungen, Fehlernährung, Suchtverhalten, Doping."]],
[["Nenne die Hauptgütekriterien eines Tests.","Objektivität, Reliabilität, Validität."],["Was bedeutet Reliabilität?","Zuverlässigkeit: Wiederholte Messung führt zu gleichen Ergebnissen."],["Nenne die koordinativen Fähigkeiten.","Gleichgewicht, Reaktion, Orientierung, Differenzierung, Rhythmisierung, Kopplung, Umstellung."],["Wozu dient der Motorische Test NRW?","Standardisierte Erfassung der motorischen Leistungsfähigkeit im Schulsport (u. a. Kraft, Ausdauer, Schnelligkeit, Koordination)."],["Welche Anforderungen berücksichtigt das KAR-Modell?","Informationsanforderungen (Analysatoren) und Druckbedingungen. Gleichgewichtsanforderungen sind eine übergreifende Kategorie."]]];

["2024 HT 1 · Aufgabe 1",5,"Stelle die Energiebereitstellungsprozesse bei einer Langzeit-Ausdauerbelastung dar und erkläre das Phänomen des „Hungerasts“ mit Konsequenzen.","• Langzeitausdauer ab ca. 10 Min.; ATP-Spaltung, Resynthese nötig\n• anaerob-alaktazid: ATP/KP ohne O2, kurzfristig\n• anaerob-laktazid: Glykogen ohne O2 mit Laktat, Übersäuerung\n• aerob: Glykogen und Fettsäuren mit O2 zu CO2 und Wasser\n• Lipolyse: Fettverbrennung mit wachsendem Anteil\n• Hungerast: nach ca. 90 Min. Glykogen leer, Blutzucker sinkt, Fettstoffwechsel braucht mehr O2, kein fließender Übergang\n• Konsequenz: Kohlenhydrate rechtzeitig zuführen"],

["2025 HT 2 · Aufgabe 1",10,"Stelle das Modell der Salutogenese (Antonovsky) dar und erläutere, wie Selbstvermessung (Quantified Self) den Kohärenzsinn positiv beeinflussen kann.","• Gesundheit als Prozess auf einem Kontinuum, körperlich, psychisch, sozial\n• Ressourcenstärkung statt nur Risikovermeidung; Kohärenzsinn: Verstehbarkeit, Handhabbarkeit, Bedeutsamkeit\n• QS: Messwerte machen Training-Wirkung erfahrbar (Verstehbarkeit)\n• Tracker erleichtern gezieltes Training (Handhabbarkeit)\n• sichtbare Verbesserung, z. B. Ruhepuls, gibt Sinn (Bedeutsamkeit)"],

["2026 HT 1 · Aufgabe 1",5,"Stelle die Prozesse der Energiebereitstellung im Muskel dar und erläutere, welche beim Turnen einer 90-sekündigen Schwebebalken-Kür relevant sind.","• ATP-Spaltung, Resynthese über KP, Glykogen, Fettsäuren\n• alle Systeme starten gleichzeitig, Anteil nach Dauer und Intensität\n• alaktazid, laktazid, aerob (je mit Merkmalen)\n• Kür: Akrobatik braucht Schnell- und Maximalkraft, hohe Energierate\n• 8 Elemente in 90 Sek., kaum Erholung; anaerob-laktazide Bereitstellung dominiert"],

function topic(i){run(sh(FRI.filter(x=>x.ti==i)).concat(OPI[i],ABI.filter(x=>x.ti==i),sh(MC.filter(x=>x.ti==i)).slice(0,2)),T[i].n)}
function ueben(){const wr=ALL.filter(x=>ST.q[x.key]!=null&&ST.q[x.key]<1);
app.innerHTML=`<h1>Üben</h1><p class="sub">Wähle ein Thema aus den Fokussierungen der Vorgaben 2027. Jedes Thema hat freie Kurzaufgaben, Operator- und Abituraufgaben.</p><div class="grid"><button class="t all" id="mx"><b>Alle Themen mischen</b><small>12 freie Aufgaben und 3 MC-Fragen</small></button><button class="t all" id="wr" ${wr.length?"":"disabled"}><b>Nur Fehler wiederholen</b><small>${wr.length} Aufgaben offen</small></button>${T.map((t,i)=>`<button class="t" data-i="${i}"><b>${t.n}</b><small>${t.d}</small>${bar(mast(i))}<span class="tag">${mast(i)} % gemeistert</span></button>`).join("")}</div>`;
$("#mx").onclick=()=>run(sh(FRI).slice(0,12).concat(sh(MC).slice(0,3)),"Gemischt");
$("#wr").onclick=()=>run(sh(wr).slice(0,15),"Fehler");
app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>topic(+b.dataset.i))}
function run(items,title,onend){S={items,p:0,s:0,title,onend,ans:false};show()}
function show(){if(S.p>=S.items.length)return end();
const it=S.items[S.p],pc=Math.round(S.p/S.items.length*100);
let h=`<div class="bar"><button class="b g" id="bk">Beenden</button><span class="meta">${S.title}: ${S.p+1} von ${S.items.length}</span></div><div class="prog"><i style="width:${pc}%"></i></div><div class="q"><div class="meta">${it.t}${it.lab?" · "+it.lab:""}</div>`;
if(it.k=="mc"){const [q,o]=it.m;S.cur=sh(o.map((x,n)=>[x,n]));
h+=`<h2>${q}</h2>`+S.cur.map(([x],k)=>`<button class="o" data-k="${k}">${x}</button>`).join("")+`<div id="fb"></div>`}
else h+=`<h2>${it.o[0]}</h2><textarea placeholder="Schreibe deine Antwort in eigenen Worten …"></textarea><div class="row"><button class="b" id="sol">Musterlösung zeigen</button></div><div id="fb"></div>`;
app.innerHTML=h+`</div>`;$("#bk").onclick=()=>go(V);
if(it.k=="mc")app.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
else $("#sol").onclick=()=>{$("#sol").disabled=true;$("#fb").innerHTML=`<div class="sol">${it.o[1]}</div><p class="sub" style="margin-top:12px">Wie gut war deine Antwort?</p><div class="row"><button class="b g" data-r="1">Gewusst</button><button class="b g" data-r="0.5">Teilweise</button><button class="b g" data-r="0">Nicht gewusst</button></div>`;
app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const v=+b.dataset.r;ST.q[it.key]=v;S.s+=v;save();next()})}}
function pick(k){if(S.ans)return;S.ans=true;const it=S.items[S.p],[q,o,c,e]=it.m,ok=S.cur[k][1]==c;if(ok)S.s++;ST.q[it.key]=ok?1:0;save();
app.querySelectorAll(".o").forEach((b,n)=>{b.disabled=true;if(S.cur[n][1]==c)b.classList.add("ok");else if(n==k)b.classList.add("no")});
$("#fb").innerHTML=`<div class="fb"><b>${ok?"Richtig.":"Leider falsch."}</b> ${e}</div><div class="row"><button class="b" id="nx">Weiter</button></div>`;$("#nx").onclick=next;$("#nx").focus()}
function next(){S.p++;S.ans=false;show()}
function end(){if(S.onend)S.onend();const n=S.items.length,pc=Math.round(S.s/n*100);
app.innerHTML=`<div class="q"><p class="big">${Math.round(S.s*10)/10} / ${n}</p><h2>${pc>=80?"Sehr stark, das sitzt.":pc>=50?"Solide Basis. Wiederhole die Fehler.":"Noch Luft nach oben. Lies die Lösungen und starte erneut."}</h2><p class="sub">Punkte aus Selbstbewertung und Multiple-Choice (${pc} %).</p><div class="row"><button class="b" id="hm">Weiter</button></div></div>`;$("#hm").onclick=()=>go(V)}
function wissen(){
app.innerHTML=`<h1>Wissen</h1><p class="sub">Operatoren sagen dir, was in der Aufgabe von dir verlangt wird. Lies die Aufgabenstellung immer zuerst auf den Operator.</p>${OPS.map(o=>`<div class="q op"><div class="meta">Anforderungsbereich ${o[1]}</div><h2>${o[0]}</h2><p style="margin:0">${o[2]}</p></div>`).join("")}<h3 class="hd">Anforderungsbereiche</h3>${AFB.map(a=>`<div class="q op"><h2>${a[0]}</h2><p style="margin:0">${a[1]}</p></div>`).join("")}<h3 class="hd">Bewertung</h3><div class="q"><p style="margin:0">Insgesamt 100 Punkte: 80 für die inhaltliche Leistung (drei Teilaufgaben) und 20 für die Darstellungsleistung (Struktur, Fachsprache, Sprachrichtigkeit, Verbindung von Darstellung, Analyse und Bewertung). 100–95 Punkte entsprechen 15 Notenpunkten, 19–0 Punkte 0 Notenpunkten.</p></div>`}
function klausur(){const h=ST.kl.slice(-5).reverse(),f=foc();
app.innerHTML=`<h1>Klausurmodus</h1><p class="sub">Zwei echte Abituraufgaben zur Auswahl (Material entfällt, nutze eigene Beispiele). Original: 300 Minuten inklusive Auswahlzeit.${f.length?" Es werden bevorzugt deine Klausurthemen gezogen.":""}</p><div class="q"><div class="row">${[45,90,180,300].map(m=>`<button class="b g" data-m="${m}">${m} Min</button>`).join("")}</div></div>${h.length?`<h3 class="hd">Letzte Selbstbewertungen</h3>${h.map(x=>`<div class="meta">${x.d}: ${x.p} % (${x.t})</div>`).join("")}`:""}`;
app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>kstart(+b.dataset.m*60))}
function kstart(sec){let pool=ABI.filter(x=>foc().includes(x.ti));if(pool.length<2)pool=ABI;const a=sh(pool).slice(0,2);let pk=null,left=sec;
const tick=()=>{const m=$("#tm");if(m)m.textContent="Restzeit "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0")};
const fin=()=>{clearInterval(TM);const x=a[pk];$("#ab").disabled=true;$("#fb").innerHTML=`<div class="sol">${x.o[1]}</div><p class="sub" style="margin-top:12px">Wie viel Prozent deiner Lösung deckt die Musterlösung ab?</p><div class="row">${[0,25,50,75,100].map(p=>`<button class="b g" data-p="${p}">${p} %</button>`).join("")}</div>`;
app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ST.kl.push({d:today(),p:+b.dataset.p,t:x.lab});save();go("klausur")})};
const draw=()=>{const t=$("textarea"),v=t?t.value:"";app.innerHTML=`<div class="bar"><button class="b g" id="bk">Abbrechen</button><span class="meta" id="tm"></span></div><div class="q">${a.map((x,i)=>`<button class="o ${pk===i?"ok":""}" data-i="${i}"><b>Aufgabe ${"AB"[i]}</b> (${x.lab})<br>${x.o[0]}</button>`).join("")}${pk!==null?`<textarea style="min-height:220px" placeholder="Deine Bearbeitung …"></textarea><div class="row"><button class="b" id="ab">Abgeben und Musterlösung zeigen</button></div><div id="fb"></div>`:""}</div>`;
if($("textarea"))$("textarea").value=v;$("#bk").onclick=()=>go("klausur");app.querySelectorAll(".o").forEach(b=>b.onclick=()=>{pk=+b.dataset.i;draw()});if($("#ab"))$("#ab").onclick=fin;tick()};
TM=setInterval(()=>{left--;tick();if(left<=0){clearInterval(TM);if(pk!==null&&$("#ab")&&!$("#ab").disabled)fin()}},1000);draw()}
function plan(){const e=ST.exam,days=e?Math.ceil((new Date(e)-new Date(today()))/864e5):null;
let h=`<h1>Klausurplanung</h1><p class="sub">Wähle die Themen, die in deiner nächsten Klausur dran sind. Sie werden gesondert gelernt und im Plan zuerst gesetzt.</p><div class="q"><h2>Klausurthemen</h2>${T.map((t,i)=>`<label class="pl"><input type="checkbox" data-f="${i}" ${ST.focus[i]?"checked":""}> <span><b>${t.n}</b><br><small>${mast(i)} % gemeistert</small></span></label>`).join("")}<div class="row"><button class="b" id="kf" ${foc().length?"":"disabled"}>Klausurthemen lernen</button></div></div>
<div class="q" style="margin-top:12px"><label>Klausurtermin <input type="date" id="ex" value="${e}"></label></div>`;
if(e&&days>0){const o=ord().sort((a,b)=>(ST.focus[b]?1:0)-(ST.focus[a]?1:0)),wk=Math.max(1,Math.floor(days/7)),per=Math.ceil(T.length/wk);
h+=`<div class="stats" style="margin-top:12px"><div class="st"><b>${days}</b><span>Tage</span></div><div class="st"><b>${wk}</b><span>Wochen</span></div><div class="st"><b>${per}</b><span>Themen pro Woche</span></div></div>`;
for(let w=0;w<Math.ceil(T.length/per);w++)h+=`<h3 class="hd">Woche ${w+1}</h3>`+o.slice(w*per,(w+1)*per).map(i=>`<label class="pl"><input type="checkbox" data-i="${i}" ${ST.plan[i]?"checked":""}> <span><b>${T[i].n}</b>${ST.focus[i]?' <span class="tag">Klausur</span>':""}<br><small>${mast(i)} % gemeistert</small></span></label>`).join("")}
else if(e)h+=`<p class="sub">Der Termin liegt in der Vergangenheit.</p>`;
app.innerHTML=h;$("#ex").onchange=ev=>{ST.exam=ev.target.value;save();plan()};
$("#kf").onclick=()=>run(focItems(),"Klausurthemen");
app.querySelectorAll("[data-f]").forEach(c=>c.onchange=()=>{ST.focus[c.dataset.f]=c.checked;save();plan()});
app.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{ST.plan[c.dataset.i]=c.checked;save()})}
go("heute");
</script>
</body>
</html>
